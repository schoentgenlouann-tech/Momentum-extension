<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#24362f">
    <title>Stillpoint</title>
    <link rel="stylesheet" href="styles.css">
    <script src="newtab.js" defer></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <header class="topbar">
      <a class="wordmark" href="#main" aria-label="Stillpoint home">
        <span class="mark" aria-hidden="true"><span></span></span>
        <span>stillpoint</span>
      </a>
      <div class="topbar-actions">
        <span class="photo-hint">Make this place yours</span>
        <button class="quiet-button" id="change-photo" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M4 7.5h3l1.4-2h7.2l1.4 2h3v11H4v-11Z" />
            <circle cx="12" cy="13" r="3.5" />
          </svg>
          <span>Change photo</span>
        </button>
        <button class="icon-button" id="reset-photo" type="button" aria-label="Reset background photo" title="Reset background photo">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M4.5 10a7.5 7.5 0 1 1 .7 5.7M4.5 4.5V10H10" />
          </svg>
        </button>
      </div>
      <input id="photo-input" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
    </header>

    <main id="main" class="dashboard">
      <section class="welcome" aria-labelledby="greeting">
        <p class="eyebrow" id="today-date"></p>
        <h1 id="greeting">Good morning.</h1>
        <time id="clock" class="clock" aria-label="Current local time">--:--</time>
      </section>

      <section class="task-panel" aria-labelledby="task-heading">
        <div class="task-heading-row">
          <div>
            <p class="eyebrow">A CLEAR PLACE TO BEGIN</p>
            <h2 id="task-heading">Your list</h2>
          </div>
          <span class="task-count" id="task-count" aria-live="polite">0 open</span>
        </div>
        <form id="task-form" class="task-form">
          <label class="visually-hidden" for="task-input">Add a task</label>
          <input id="task-input" name="task" type="text" maxlength="120" placeholder="What needs your attention?" autocomplete="off">
          <button type="submit" class="add-button" aria-label="Add task" title="Add task">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </form>
        <p class="task-error" id="task-error" role="status" aria-live="polite"></p>
        <ul class="task-list" id="task-list" aria-label="Tasks"></ul>
        <p class="empty-state" id="empty-state">A little space for what matters.</p>
      </section>
    </main>

    <footer class="footer-note">
      <span>Take today one thing at a time.</span>
    </footer>

    <div class="drop-prompt" id="drop-prompt" aria-hidden="true">
      <div class="drop-prompt-inner">
        <span class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4" /></svg>
        </span>
        <span>Drop a photo to make it yours</span>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
